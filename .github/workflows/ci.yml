name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

jobs:
  # Syntax check across every PHP version we claim to support. This is the
  # cheapest useful signal in the repo: it catches parse errors and obvious
  # typos before we spend time on a fuller test run.
  lint-php:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.2', '8.3', '8.4' ]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@4aba0efa1f27403dcb5ed35107703c97aed2d540 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 -P4 php -l

  test:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        wp: [ '6.4', 'latest' ]
    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@4aba0efa1f27403dcb5ed35107703c97aed2d540 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: sqlite3, mysqli
      - name: Install subversion (for WP core + test suite)
        run: sudo apt-get install -y subversion
      - name: Install WP test suite + parent plugin + companion plugin
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: bash bin/install-wp-tests.sh
      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Run tests
        run: composer test

  # Scoped to the LINES a pull request actually adds, not merely the files
  # it touches. Same rationale as comic-easel: the sniffs cannot see through
  # apply_filters() to an escaper inside it, and a job that is red by default
  # is a job everyone learns to scroll past. Advisory, not a gate.
  # Static analysis with Phan + Psalm. Required: both run against committed
  # baselines (.phan/baseline.php, psalm-baseline.xml), so the job is green on
  # master and only NEW findings fail the build. Regenerate baselines with
  # `vendor/bin/phan --save-baseline=.phan/baseline.php` and
  # `vendor/bin/psalm --set-baseline=psalm-baseline.xml` when analysed code
  # moves.
  static-analysis:
    name: Static analysis (Phan + Psalm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@4aba0efa1f27403dcb5ed35107703c97aed2d540 # v2
        with:
          php-version: '8.3'
          coverage: none
          # Phan 6 needs the ast extension for full analysis.
          extensions: ast
      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Run Phan
        run: vendor/bin/phan --no-progress-bar --output-mode=github
      - name: Run Psalm
        run: vendor/bin/psalm --no-progress --output-format=github

  phpcs:
    name: PHPCS (advisory, changed lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@4aba0efa1f27403dcb5ed35107703c97aed2d540 # v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install composer deps
        run: composer install --no-interaction --prefer-dist
      - name: Report PHPCS findings on added lines
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE" ]; then
            BASE="$(git merge-base "$BASE" HEAD)"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No base commit to compare against; skipping."
            exit 0
          fi
          echo "Comparing against $BASE"
          git diff --unified=0 "$BASE" HEAD -- '*.php' > /tmp/pr.diff
          FILES="$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- '*.php' | grep -v '^vendor/' || true)"
          if [ -z "$FILES" ]; then
            echo "No PHP files changed; nothing to check."
            exit 0
          fi
          echo "$FILES" | tr '\n' ' '; echo
          echo "$FILES" | xargs ./vendor/bin/phpcs -q --report=json > /tmp/phpcs.json || true
          python3 .github/scripts/phpcs-added-lines.py /tmp/phpcs.json /tmp/pr.diff